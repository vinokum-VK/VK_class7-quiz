<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class 7 Multi-Subject Quiz (CBSE & Karnataka Board)</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      --radius: 14px;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e3a8a;
      --success: #22c55e;
      --success-bg: #052e16;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --warn: #fbbf24;
      --warn-bg: #451a03;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      transition: background 0.25s, color 0.25s;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .theme-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .board-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg);
      padding: 5px;
      border-radius: 11px;
      border: 1px solid var(--border);
    }

    .board-btn {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
    }

    .board-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .subject-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .hint-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      display: none;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      padding: 13px 15px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.96rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }
    .option-btn.correct .opt-letter {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }
    .option-btn.wrong .opt-letter {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .explanation-panel {
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    .explanation-panel h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .exp-item {
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 0.88rem;
      line-height: 1.45;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .exp-item.is-right {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .nav-group {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .summary-screen {
      display: none;
      text-align: center;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--primary-light);
      border: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px auto 16px;
    }

    .score-circle span {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-circle small {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .review-list {
      text-align: left;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .review-card {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 14px;
      background: var(--bg);
      font-size: 0.9rem;
    }

    .review-card p {
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .tag-pass { color: var(--success); font-weight: 700; }
    .tag-fail { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="top-bar">
        <div class="title-group">
          <h1>Class 7 Multi-Subject Quiz</h1>
          <p id="boardSubtitle">CBSE (NCERT) Curriculum • Detailed Explanations</p>
        </div>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
      </div>
      <div class="board-switcher">
        <button class="board-btn active" id="btnCBSE" onclick="switchBoard('cbse')">CBSE (NCERT)</button>
        <button class="board-btn" id="btnKarnataka" onclick="switchBoard('karnataka')">Karnataka Board (KSEAB)</button>
      </div>
    </header>

    <div class="filters" id="subjectFilters"></div>

    <main class="card" id="quizCard">
      <div class="progress-row">
        <span id="qCounter">Question 1 of 10</span>
        <span class="subject-badge" id="qSubject">Mathematics</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-text" id="questionText"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="options-list" id="optionsList"></div>

      <div class="explanation-panel" id="explanationPanel">
        <h3>Answer Breakdown & Explanations</h3>
        <div id="explanationList"></div>
      </div>

      <div class="controls">
        <button class="btn" id="hintBtn" onclick="toggleHint()">💡 Hint</button>
        <div class="nav-group">
          <button class="btn" id="prevBtn" onclick="prevQuestion()">← Prev</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
        </div>
      </div>
    </main>

    <section class="card summary-screen" id="summaryScreen">
      <h2>Quiz Completed!</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-top: 4px;" id="summaryBoardLabel"></p>
      <div class="score-circle">
        <span id="finalScore">0/10</span>
        <small id="finalPercent">0%</small>
      </div>
      <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
      <div class="review-list" id="reviewList"></div>
    </section>
  </div>

  <script>
    const QUIZ_DATA = {
      cbse: [
        {
          subject: "Mathematics",
          question: "If the perimeter of a rectangle is 40 cm and its length is 4 cm more than its breadth, what is the area of the rectangle?",
          hint: "Use Perimeter = 2 × (Length + Breadth) to find the breadth first, then multiply Length × Breadth.",
          answer: 1,
          options: [
            { text: "84 cm²", exp: "Incorrect. This results from taking dimensions as 14 cm and 6 cm, which gives a difference of 8 cm instead of 4 cm." },
            { text: "96 cm²", exp: "Correct! Let breadth = b, so length = b + 4. Perimeter: 2(b + b + 4) = 40 ⇒ 2b + 4 = 20 ⇒ b = 8 cm, length = 12 cm. Area = 12 × 8 = 96 cm²." },
            { text: "100 cm²", exp: "Incorrect. 100 cm² would be the area of a square with side 10 cm (where length equals breadth)." },
            { text: "64 cm²", exp: "Incorrect. 64 cm² is the square of the breadth (8 × 8), forgetting that the length is 4 cm longer." }
          ]
        },
        {
          subject: "Science",
          question: "During photosynthesis, plants convert light energy into chemical energy. Which gas is released as a byproduct, and through which leaf structures does it primarily exit?",
          hint: "Think about the tiny pores on the underside of leaves regulated by guard cells.",
          answer: 0,
          options: [
            { text: "Oxygen; stomata", exp: "Correct! Oxygen is produced when water molecules split during photosynthesis and exits leaves through tiny pores called stomata." },
            { text: "Carbon dioxide; lenticels", exp: "Incorrect. Carbon dioxide is absorbed (not released) during photosynthesis, and lenticels are pores on woody stems." },
            { text: "Nitrogen; guard cells", exp: "Incorrect. Plants do not release nitrogen gas during photosynthesis; guard cells surround and control the stomatal opening." },
            { text: "Oxygen; xylem", exp: "Incorrect. While oxygen is released, xylem is vascular tissue that transports water and minerals from roots to leaves." }
          ]
        },
        {
          subject: "Social Science",
          question: "In the Delhi Sultanate, who introduced the 'token currency' system using brass and copper coins equal in value to silver tankas, which ultimately failed due to widespread counterfeiting?",
          hint: "This Tughluq ruler is also known for shifting his capital from Delhi to Daulatabad.",
          answer: 2,
          options: [
            { text: "Alauddin Khalji", exp: "Incorrect. Alauddin Khalji is famous for strict market control policies and price regulations rather than token currency." },
            { text: "Firoz Shah Tughluq", exp: "Incorrect. Firoz Shah Tughluq focused on canal irrigation, public works, and restoring stability after his cousin's reign." },
            { text: "Muhammad bin Tughluq", exp: "Correct! In 1329–30 CE, Muhammad bin Tughluq issued brass and copper token coins at par with silver tankas, but lack of state monopoly on minting led to mass forgery." },
            { text: "Iltutmish", exp: "Incorrect. Iltutmish standardized the silver tanka and copper jital, which were valued by their actual metal weight." }
          ]
        },
        {
          subject: "Mathematics",
          question: "Evaluate the exponential expression: (3⁵ × 10⁵ × 25) ÷ (5⁷ × 6⁵).",
          hint: "Break composite bases into prime factors: 10 = 2 × 5, 25 = 5², and 6 = 2 × 3.",
          answer: 0,
          options: [
            { text: "1", exp: "Correct! Rewrite in prime factors: (3⁵ × 2⁵ × 5⁵ × 5²) ÷ (5⁷ × 2⁵ × 3⁵) = (2⁵ × 3⁵ × 5⁷) ÷ (2⁵ × 3⁵ × 5⁷) = 1." },
            { text: "5", exp: "Incorrect. All powers of 5 cancel out completely because 5⁵ × 5² = 5⁷ in the numerator matches 5⁷ in the denominator." },
            { text: "25", exp: "Incorrect. 25 (5²) cancels with the remaining powers of 5 after dividing 5⁵ by 5⁷." },
            { text: "0", exp: "Incorrect. When identical non-zero numerator and denominator terms cancel out, the quotient is 1, never 0." }
          ]
        },
        {
          subject: "Science",
          question: "A clinical thermometer has a slight bend or 'kink' in its capillary tube just above the bulb. What is the primary function of this kink?",
          hint: "Think about what happens when you remove a thermometer from your mouth to read the temperature.",
          answer: 1,
          options: [
            { text: "It helps mercury expand faster when heated.", exp: "Incorrect. Expansion depends on the glass bulb's thin wall and mercury's thermal properties, not the kink." },
            { text: "It prevents the mercury level from falling on its own.", exp: "Correct! The kink holds the mercury thread in place after removal from the body so you can read the temperature accurately before shaking it down." },
            { text: "It stops the glass tube from breaking at high temperatures.", exp: "Incorrect. A clinical thermometer only measures 35°C to 42°C and can still break if exposed to boiling water." },
            { text: "It filters out air bubbles inside the capillary.", exp: "Incorrect. The capillary tube is evacuated of air during manufacturing; the kink is purely a mechanical constriction." }
          ]
        },
        {
          subject: "Social Science",
          question: "Which layer of the Earth's atmosphere contains the ozone layer that shields life on Earth from harmful ultraviolet (UV) radiation?",
          hint: "This is the second major layer above the Earth's surface, lying just above the troposphere.",
          answer: 1,
          options: [
            { text: "Troposphere", exp: "Incorrect. The troposphere is the lowest layer where weather phenomena like rain, fog, and clouds occur." },
            { text: "Stratosphere", exp: "Correct! The stratosphere extends from about 10 km to 50 km above Earth and houses the ozone layer that absorbs UV rays." },
            { text: "Mesosphere", exp: "Incorrect. The mesosphere lies above the stratosphere and is where most meteorites burn up upon entry." },
            { text: "Thermosphere", exp: "Incorrect. The thermosphere contains the ionosphere used for radio transmission and experiences extreme temperatures." }
          ]
        },
        {
          subject: "Science",
          question: "Which of the following is a chemical change rather than a physical change?",
          hint: "Look for a process where brand-new substances (such as salt and water) are formed.",
          answer: 3,
          options: [
            { text: "Dissolving common salt in water", exp: "Incorrect. Dissolving salt is a reversible physical change; evaporating the water recovers the original salt." },
            { text: "Melting of ice cubes into liquid water", exp: "Incorrect. Melting only changes the physical state of H₂O from solid to liquid without altering its chemical composition." },
            { text: "Cutting a sheet of paper into small pieces", exp: "Incorrect. Cutting changes size and shape only; the material remains paper." },
            { text: "Neutralisation of hydrochloric acid with sodium hydroxide", exp: "Correct! Acid + Base reacts to form entirely new chemical substances: sodium chloride (salt) and water." }
          ]
        },
        {
          subject: "Mathematics",
          question: "In △ABC, the exterior angle ∠ACD formed by extending side BC to D measures 115°. If ∠A = 45°, what is the measure of ∠ACB?",
          hint: "∠ACB and ∠ACD form a linear pair on the straight line BCD.",
          answer: 2,
          options: [
            { text: "70°", exp: "Incorrect. 70° is the measure of the other interior opposite angle ∠B (115° − 45° = 70°), not ∠ACB." },
            { text: "45°", exp: "Incorrect. 45° is the given measure of ∠A." },
            { text: "65°", exp: "Correct! Since BCD is a straight line, ∠ACB + ∠ACD = 180° (linear pair). Therefore, ∠ACB = 180° − 115° = 65°." },
            { text: "115°", exp: "Incorrect. 115° is the exterior angle ∠ACD itself." }
          ]
        },
        {
          subject: "Social Science",
          question: "In Indian state governance, what is the primary constitutional role of the Governor of a state?",
          hint: "Compare the Governor's role in a state to the President's role at the central level.",
          answer: 0,
          options: [
            { text: "Acting as the nominal head of the state appointed by the Central Government", exp: "Correct! The Governor is the constitutional head of the state appointed by the President of India to ensure the state government functions within the Constitution." },
            { text: "Leading the majority party in the State Legislative Assembly", exp: "Incorrect. The Chief Minister is the elected leader of the majority party and the real executive head." },
            { text: "Serving as the Chief Justice of the State High Court", exp: "Incorrect. The High Court is the independent judicial branch, separate from the executive office of the Governor." },
            { text: "Conducting municipal and panchayat elections directly", exp: "Incorrect. Local body elections are conducted by the State Election Commission." }
          ]
        },
        {
          subject: "English",
          question: "Identify the sentence that correctly transforms the following active voice sentence into passive voice:
"The school committee will announce the annual sports results tomorrow."",
          hint: "For simple future tense ('will + verb'), passive voice uses 'will be + past participle'.",
          answer: 2,
          options: [
            { text: "The annual sports results are announced by the school committee tomorrow.", exp: "Incorrect. 'Are announced' shifts the tense to simple present instead of keeping the future tense." },
            { text: "The annual sports results will announce by the school committee tomorrow.", exp: "Incorrect. This omits 'be' and fails to use the past participle ('announced')." },
            { text: "The annual sports results will be announced by the school committee tomorrow.", exp: "Correct! The object ('the annual sports results') becomes the subject, followed by 'will be + past participle (announced)'." },
            { text: "The annual sports results would have been announced by the school committee tomorrow.", exp: "Incorrect. 'Would have been' changes the modal and tense to a past conditional." }
          ]
        }
      ],
      karnataka: [
        {
          subject: "Mathematics",
          question: "If the product of two integers is −48 and one of the integers is 6, what is the result when the other integer is divided by −2?",
          hint: "First find the second integer by dividing −48 by 6, then divide that result by −2.",
          answer: 1,
          options: [
            { text: "−4", exp: "Incorrect. Dividing a negative integer (−8) by another negative integer (−2) yields a positive quotient." },
            { text: "4", exp: "Correct! Other integer = (−48) ÷ 6 = −8. Then, (−8) ÷ (−2) = +4." },
            { text: "−16", exp: "Incorrect. −16 comes from multiplying −8 by 2 instead of dividing by −2." },
            { text: "16", exp: "Incorrect. 16 comes from multiplying −8 by −2 instead of dividing." }
          ]
        },
        {
          subject: "Mathematics",
          question: "A gardener has a circular flower bed with a circumference of 44 m. Using π = 22/7, what is the area of this flower bed?",
          hint: "Find radius r using Circumference = 2πr, then compute Area = πr².",
          answer: 2,
          options: [
            { text: "44 m²", exp: "Incorrect. 44 m is the circumference (perimeter), not the area." },
            { text: "88 m²", exp: "Incorrect. 88 results from computing 2 × π × r × 2 without squaring the radius." },
            { text: "154 m²", exp: "Correct! 2 × (22/7) × r = 44 ⇒ r = 7 m. Area = (22/7) × 7 × 7 = 154 m²." },
            { text: "616 m²", exp: "Incorrect. 616 m² uses the diameter (14 m) as the radius in πr²." }
          ]
        },
        {
          subject: "Social Science",
          question: "Which ruler of the Vijayanagara Empire was known by the title 'Yavana Rajya Pratishthapanacharya' and authored the Telugu epic 'Amuktamalyada'?",
          hint: "He belonged to the Tuluva dynasty and his court was adorned by the Ashtadiggajas.",
          answer: 0,
          options: [
            { text: "Krishnadevaraya", exp: "Correct! Krishnadevaraya (reigned 1509–1529 CE) earned this title after restoring the Bahmani Sultan to his throne and wrote 'Amuktamalyada'." },
            { text: "Harihara I", exp: "Incorrect. Harihara I co-founded the Vijayanagara Empire in 1336 CE under the Sangama dynasty." },
            { text: "Devaraya II", exp: "Incorrect. Devaraya II (Praudha Devaraya) was the greatest ruler of the Sangama dynasty, not the author of Amuktamalyada." },
            { text: "Bukka Raya I", exp: "Incorrect. Bukka Raya I was the brother of Harihara I and helped consolidate early Vijayanagara rule." }
          ]
        },
        {
          subject: "Science",
          question: "During a science experiment, a student dips a strip of blue litmus paper and a strip of red litmus paper into a colourless solution. Neither strip changes colour. What can be concluded about the nature of the solution?",
          hint: "Acids turn blue litmus red; bases turn red litmus blue.",
          answer: 2,
          options: [
            { text: "It is strongly acidic.", exp: "Incorrect. An acidic solution would turn the blue litmus strip red." },
            { text: "It is strongly basic.", exp: "Incorrect. A basic (alkaline) solution would turn the red litmus strip blue." },
            { text: "It is a neutral substance.", exp: "Correct! Neutral solutions (such as distilled water or salt water) do not change the colour of either red or blue litmus." },
            { text: "It is an organic indicator.", exp: "Incorrect. Litmus itself is the indicator; the solution being tested is neutral." }
          ]
        },
        {
          subject: "Social Science",
          question: "In the context of Indian Civics, which part of the Indian Constitution contains the Directive Principles of State Policy, and are they legally enforceable by courts?",
          hint: "Fundamental Rights are in Part III and are enforceable; Directive Principles follow right after.",
          answer: 1,
          options: [
            { text: "Part III; enforceable", exp: "Incorrect. Part III contains Fundamental Rights, which are justiciable (enforceable by courts)." },
            { text: "Part IV; non-enforceable", exp: "Correct! Part IV (Articles 36–51) contains the Directive Principles of State Policy, which guide governance but cannot be enforced in a court of law." },
            { text: "Part IV-A; enforceable", exp: "Incorrect. Part IV-A contains Fundamental Duties." },
            { text: "Part II; non-enforceable", exp: "Incorrect. Part II deals with Citizenship." }
          ]
        },
        {
          subject: "Science",
          question: "Which combination of events occurs in the human thoracic cavity during the process of inhalation?",
          hint: "To draw air into the lungs, the volume of the chest cavity must increase.",
          answer: 0,
          options: [
            { text: "Ribs move outward and diaphragm moves downward.", exp: "Correct! Ribs move up and outward while the diaphragm contracts and flattens downward, expanding chest volume so air rushes in." },
            { text: "Ribs move inward and diaphragm moves upward.", exp: "Incorrect. This decreases thoracic volume and happens during exhalation (breathing out)." },
            { text: "Ribs move downward and diaphragm stays stationary.", exp: "Incorrect. Both the rib cage and the diaphragm actively move during breathing." },
            { text: "Ribs move inward and diaphragm moves downward.", exp: "Incorrect. These opposing movements do not occur together during normal inhalation." }
          ]
        },
        {
          subject: "Mathematics",
          question: "Solve for x in the linear equation: 3(x − 2) + 4 = 19.",
          hint: "First subtract 4 from both sides, then divide by 3.",
          answer: 3,
          options: [
            { text: "x = 5", exp: "Incorrect. Substituting x = 5 gives 3(3) + 4 = 13, not 19." },
            { text: "x = 6", exp: "Incorrect. Substituting x = 6 gives 3(4) + 4 = 16, not 19." },
            { text: "x = 9", exp: "Incorrect. Substituting x = 9 gives 3(7) + 4 = 25, not 19." },
            { text: "x = 7", exp: "Correct! 3(x − 2) = 19 − 4 = 15 ⇒ x − 2 = 5 ⇒ x = 7." }
          ]
        },
        {
          subject: "Social Science",
          question: "Why are the temperate grasslands of North America (the Prairies) known as the 'Granary of the World'?",
          hint: "Think about the fertile chernozem soil and mechanized farming of a major cereal crop.",
          answer: 1,
          options: [
            { text: "Dense tropical rainforest timber exports", exp: "Incorrect. The Prairies are treeless temperate grasslands, not tropical rainforests." },
            { text: "Extensive commercial wheat cultivation", exp: "Correct! Deep fertile soil, flat terrain, and modern machinery enable massive wheat production for global export." },
            { text: "High-altitude terrace rice farming", exp: "Incorrect. Terrace rice farming is typical of hilly monsoon regions in Asia." },
            { text: "Large-scale equatorial rubber plantations", exp: "Incorrect. Rubber grows in hot, humid equatorial climates, not temperate grasslands." }
          ]
        },
        {
          subject: "Mathematics",
          question: "A car travels at a uniform speed of 54 km/h for 20 minutes. What is the total distance covered by the car in kilometres?",
          hint: "Convert 20 minutes into hours (20/60 = 1/3 hour) before multiplying by speed.",
          answer: 2,
          options: [
            { text: "10.8 km", exp: "Incorrect. 10.8 km corresponds to 12 minutes (1/5 hour), not 20 minutes." },
            { text: "27 km", exp: "Incorrect. 27 km is the distance covered in 30 minutes (half an hour)." },
            { text: "18 km", exp: "Correct! Time = 20/60 = 1/3 hour. Distance = Speed × Time = 54 × (1/3) = 18 km." },
            { text: "108 km", exp: "Incorrect. 108 km is the distance covered in 2 hours." }
          ]
        },
        {
          subject: "English",
          question: "Identify the sentence that correctly converts the following direct speech into reported speech:
The teacher said to the students, "Do not make a noise in the corridor."",
          hint: "Negative imperative sentences ('Do not...') use 'not to + verb' in indirect speech.",
          answer: 0,
          options: [
            { text: "The teacher advised the students not to make a noise in the corridor.", exp: "Correct! Negative commands/advice change 'Do not + verb' into 'not to + verb'." },
            { text: "The teacher advised the students to not made a noise in the corridor.", exp: "Incorrect. 'To' must be followed by the base verb ('make'), not the past tense ('made')." },
            { text: "The teacher said the students do not make a noise in the corridor.", exp: "Incorrect. This leaves the imperative verb unconverted without an infinitive connector." },
            { text: "The teacher asked the students that do not make a noise in the corridor.", exp: "Incorrect. 'That' is not used before an imperative command in reported speech." }
          ]
        }
      ]
    };

    let currentBoard = "cbse";
    let selectedSubject = "All";
    let filteredQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      document.getElementById("themeToggle").textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }

    function switchBoard(board) {
      currentBoard = board;
      selectedSubject = "All";
      document.getElementById("btnCBSE").classList.toggle("active", board === "cbse");
      document.getElementById("btnKarnataka").classList.toggle("active", board === "karnataka");
      document.getElementById("boardSubtitle").textContent =
        board === "cbse"
          ? "CBSE (NCERT) Curriculum • Detailed Explanations"
          : "Karnataka State Board (KSEAB/DSERT) • Detailed Explanations";
      initQuiz();
    }

    function renderFilters() {
      const allQs = QUIZ_DATA[currentBoard];
      const subjects = ["All", ...new Set(allQs.map(q => q.subject))];
      const container = document.getElementById("subjectFilters");
      container.innerHTML = "";

      subjects.forEach(sub => {
        const count = sub === "All" ? allQs.length : allQs.filter(q => q.subject === sub).length;
        const btn = document.createElement("button");
        btn.className = "filter-pill" + (selectedSubject === sub ? " active" : "");
        btn.textContent = `${sub} (${count})`;
        btn.onclick = () => {
          selectedSubject = sub;
          initQuiz();
        };
        container.appendChild(btn);
      });
    }

    function initQuiz() {
      renderFilters();
      const allQs = QUIZ_DATA[currentBoard];
      filteredQuestions = selectedSubject === "All" ? [...allQs] : allQs.filter(q => q.subject === selectedSubject);
      currentIndex = 0;
      userAnswers = new Array(filteredQuestions.length).fill(null);

      document.getElementById("summaryScreen").style.display = "none";
      document.getElementById("quizCard").style.display = "block";
      renderQuestion();
    }

    function renderQuestion() {
      const q = filteredQuestions[currentIndex];
      const total = filteredQuestions.length;

      document.getElementById("qCounter").textContent = `Question ${currentIndex + 1} of ${total}`;
      document.getElementById("qSubject").textContent = q.subject;
      document.getElementById("progressFill").style.width = `${((currentIndex + 1) / total) * 100}%`;
      document.getElementById("questionText").textContent = q.question;

      const hintBox = document.getElementById("hintBox");
      hintBox.style.display = "none";
      hintBox.textContent = "💡 Hint: " + q.hint;

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";
      const letters = ["A", "B", "C", "D"];
      const chosen = userAnswers[currentIndex];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (chosen !== null) {
          btn.disabled = true;
          if (idx === q.answer) btn.classList.add("correct");
          else if (idx === chosen) btn.classList.add("wrong");
        }
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt.text}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsList.appendChild(btn);
      });

      const expPanel = document.getElementById("explanationPanel");
      const expList = document.getElementById("explanationList");
      if (chosen !== null) {
        expPanel.style.display = "block";
        expList.innerHTML = q.options
          .map((opt, idx) => {
            const isRight = idx === q.answer;
            return `<div class="exp-item ${isRight ? "is-right" : ""}">
              <strong>${letters[idx]}. ${opt.text}</strong><br/>${opt.exp}
            </div>`;
          })
          .join("");
      } else {
        expPanel.style.display = "none";
      }

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").textContent = currentIndex === total - 1 ? "Finish Quiz ✓" : "Next →";
    }

    function selectOption(idx) {
      if (userAnswers[currentIndex] !== null) return;
      userAnswers[currentIndex] = idx;
      renderQuestion();
    }

    function toggleHint() {
      const box = document.getElementById("hintBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < filteredQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById("quizCard").style.display = "none";
      const summary = document.getElementById("summaryScreen");
      summary.style.display = "block";

      let score = 0;
      filteredQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) score++;
      });

      const total = filteredQuestions.length;
      const pct = Math.round((score / total) * 100);
      document.getElementById("summaryBoardLabel").textContent =
        `${currentBoard === "cbse" ? "CBSE (NCERT)" : "Karnataka State Board"} • Subject: ${selectedSubject}`;
      document.getElementById("finalScore").textContent = `${score}/${total}`;
      document.getElementById("finalPercent").textContent = `${pct}%`;

      const reviewList = document.getElementById("reviewList");
      reviewList.innerHTML = filteredQuestions
        .map((q, idx) => {
          const chosen = userAnswers[idx];
          const isCorrect = chosen === q.answer;
          const userText = chosen !== null ? q.options[chosen].text : "Not answered";
          const correctText = q.options[q.answer].text;
          return `<div class="review-card">
            <p><strong>Q${idx + 1} (${q.subject}):</strong> ${q.question}</p>
            <p>Your Answer: <span class="${isCorrect ? "tag-pass" : "tag-fail"}">${userText}</span></p>
            ${!isCorrect ? `<p>Correct Answer: <span class="tag-pass">${correctText}</span></p>` : ""}
            <p style="color: var(--muted); font-size: 0.85rem; margin-top: 4px;">${q.options[q.answer].exp}</p>
          </div>`;
        })
        .join("");
    }

    function restartQuiz() {
      initQuiz();
    }

    initQuiz();
  </script>
</body>
</html>
